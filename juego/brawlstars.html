<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('ss-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brawl Stars · Sunshine Squad</title>
  <link rel="icon" type="image/png" href="../img/logo/sunshine_squad.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .game-hero.brawlstars { border-bottom: 3px solid #f6815a; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="site-logo" href="../index.html">Sunshine Squad</a>
      <div id="site-nav-slot"></div>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menú">☰</button>
    </div>
  </header>

  <div class="game-hero brawlstars">
    <div class="inner">
      <h1 class="game-hero-title">
        <span class="game-badge" style="background:color-mix(in srgb,#f6815a 12%,white);color:#f6815a;border:1px solid #f6815a;font-size:.85rem;padding:4px 12px">BRAWLSTARS</span>
        Brawl Stars
      </h1>
      <p class="game-hero-desc">Descripción del juego — edita este archivo en <code>juego/brawlstars.html</code></p>
    </div>
  </div>

  <main>
    <section class="section">
      <div class="inner">
        <div class="section-head">
          <h2 class="section-title">Galería</h2>
        </div>
        <div class="carousel-wrap carousel-images">
          <button class="carousel-btn prev">&#8592;</button>
          <div class="carousel-track">
            <div class="carousel-item" style="color:var(--muted);font-size:.85rem;padding:20px;background:var(--surface);border-radius:6px;min-width:200px;display:flex;align-items:center;justify-content:center">
              Sin imágenes aún — añade desde el panel admin
            </div>
          </div>
          <button class="carousel-btn next">&#8594;</button>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="inner">
        <div class="section-head">
          <h2 class="section-title">Guías de Brawl Stars</h2>
          <a href="../guias.html" class="section-link">Ver todas &rarr;</a>
        </div>
        <ul class="guide-list" id="guide-list">
          <li style="padding:14px 0;color:var(--muted)">Cargando&hellip;</li>
        </ul>
      </div>
    </section>
  </main>

  <div id="site-footer-slot"></div>

  <script>const SITE_ROOT = "../";</script>
  <script src="../js/layout.js"></script>
  <script src="../js/carousel.js"></script>
  <script>
  function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtDate(iso) { if (!iso) return ''; const d=new Date(iso); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const guides = await fetch('../api/guides?game=brawlstars').then(r => r.json());
      const list = document.getElementById('guide-list');
      if (!guides.length) { list.innerHTML = '<li style="color:var(--muted);padding:14px 0">Sin guías todavía.</li>'; return; }
      list.innerHTML = guides.map(g => `<li><a class="guide-item" href="../guia.html?id=${g.id}">
        <span class="guide-item-title">${escH(g.title)}</span>
        <span class="guide-item-date">${fmtDate(g.created_at)}</span>
        <span class="guide-item-arrow">&rarr;</span></a></li>`).join('');
    } catch {}
  });
  </script>
</body>
</html>
