<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="description" content="Comunidad de juego de Scythe Society. Blog y guias.">
  <link rel="icon" type="image/png" href="img/sunshine_squad.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- CSS separado por funcion. El orden importa: variables primero,

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">

<body>
  <div class="wrap">

    <header class="masthead">
      <!-- Logo con gif entre las dos palabras. El .cursor de antes
           se reemplazo por img.nameplate-gif (ver css/header.css) -->
      <h1 class="nameplate">
        Sunshine
        <img src="img/sunshine_squad_animated.gif" alt="" class="nameplate-gif">
        Squad
      </h1>
      <p class="tagline">Scythe Society · comunidad de juego, blog y guias</p>

    <!-- Nav y footer ya NO se escriben aqui: layout.js los inyecta.

    <main>
      <p class="lead">Aqui escribo lo que voy aprendiendo y armo guias directas para los
      juegos de la comunidad. Sin adornos: al grano.</p>

      <!-- ULTIMO DEL BLOG: pega aqui las 3-4 entradas mas recientes -->
      <h2 class="section-label">Ultimo del blog</h2>
      <ul class="entries">
        <li><a class="entry" href="posts/bienvenida.html">
          <span class="date">2026.07.03</span>
          <span class="title">Arranca la nueva web</span>
          <span class="arrow">&rarr;</span>
        </a></li>
      </ul>

      <!-- GUIAS: pega aqui las guias destacadas -->
      <h2 class="section-label">Guias</h2>
      <ul class="entries">
        <li><a class="entry" href="guias/ragnarok-paladin.html">
          <span class="date">Ragnarok</span>
          <span class="title">Paladin — build y arranque</span>
          <span class="arrow">&rarr;</span>
        </a></li>
      </ul>
    </main>

    <div id="site-footer"></div>

  </div>

  <!-- SITE_ROOT debe declararse ANTES de layout.js -->
  <script>const SITE_ROOT = "";</script>
  <script src="js/layout.js"></script>
