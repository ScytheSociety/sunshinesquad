<!DOCTYPE html>

<head>

  <link rel="icon" type="image/png" href="img/sunshine_squad.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- CSS separado por funcion. El orden importa: variables primero,
       responsive.css siempre al final para que pueda sobreescribir. -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/article.css">
  <link rel="stylesheet" href="css/components.css">

</head>
<body>
  <div class="wrap">

    <header class="masthead">
      <!-- Logo con gif entre las dos palabras (ver css/header.css) -->
      <h1 class="nameplate">
        Sunshine
        <img src="img/sunshine_squad_animated.gif" alt="" class="nameplate-gif">
        Squad
      </h1>
      <p class="tagline">Scythe Society · comunidad de juego, blog y guias</p>
    </header>

    <!-- Nav y footer ya NO se escriben aqui: layout.js los inyecta.
         SITE_ROOT = "" porque guias.html esta en la raiz del sitio. -->
    <div id="site-nav"></div>

    <main>
      <p class="lead">Guias directas por juego. Lo justo para arrancar y no perder el tiempo.</p>

      <!-- Agrupa por juego con una etiqueta de seccion, y lista guias debajo. -->
      <h2 class="section-label">Ragnarok Online</h2>
      <ul class="entries">
        <li><a class="entry" href="guias/ragnarok-paladin.html">
          <span class="date">Clase</span>
          <span class="title">Paladin — build y arranque</span>
          <span class="arrow">&rarr;</span>
        </a></li>
        <li><a class="entry" href="guias/ragnarok-summer_event_2026.html">
          <span class="date">Evento</span>
          <span class="title">Summer Festival 2026</span>
          <span class="arrow">&rarr;</span>
        </a></li>
      </ul>

      <!-- Copia este bloque para otro juego:
      <h2 class="section-label">World of Warcraft</h2>
      <ul class="entries">
        <li><a class="entry" href="guias/wow-tank.html">
          <span class="date">Clase</span>
          <span class="title">Tanque — arranque TBC</span>
          <span class="arrow">&rarr;</span>
        </a></li>
      </ul>
      -->
    </main>

    <div id="site-footer"></div>

  </div>

  <!-- SITE_ROOT debe declararse ANTES de layout.js -->
  <script>const SITE_ROOT = "";</script>
  <script src="js/layout.js"></script>
