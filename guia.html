<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('ss-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía · Sunshine Squad</title>
  <link rel="icon" type="image/png" href="img/logo/sunshine_squad.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="site-logo" href="index.html">Sunshine Squad</a>
      <div id="site-nav-slot"></div>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menú">☰</button>
    </div>
  </header>

  <main>
    <div class="inner">
      <div class="article-wrap" id="article-wrap">
        <p style="color:var(--muted)">Cargando&hellip;</p>
      </div>
    </div>
  </main>

  <div id="site-footer-slot"></div>

  <script>const SITE_ROOT = "";</script>
  <script src="js/layout.js"></script>
  <script src="js/lightbox.js"></script>
  <script>
  const id = new URLSearchParams(location.search).get('id');

  function escH(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  }

  document.addEventListener('DOMContentLoaded', async () => {
    if (!id) { location.href = 'guias.html'; return; }

    const [guide, user] = await Promise.all([
      fetch(`api/guides/${id}`).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('api/auth/me', { credentials: 'include' }).then(r => r.ok ? r.json() : null).catch(() => null),
    ]);

    if (!guide) {
      document.getElementById('article-wrap').innerHTML =
        '<a class="article-back" href="guias.html">&larr; Guías</a><p style="color:var(--muted);margin-top:24px">Guía no encontrada.</p>';
      return;
    }

    document.title = `${guide.title} · Sunshine Squad`;

    document.getElementById('article-wrap').innerHTML = `
      <a class="article-back" href="guias.html">&larr; Guías</a>
      <h1 class="article-title">${escH(guide.title)}</h1>
      <div class="article-meta">
        <span class="game-badge ${guide.game}">${guide.game === 'ro' ? 'Ragnarok Online' : 'World of Warcraft'}</span>
        <span class="blog-card-date">${fmtDate(guide.created_at)}</span>
        ${user?.is_owner ? `<a href="admin.html#guide-${guide.id}" class="btn btn-sm">Editar</a>` : ''}
      </div>
      <div class="article-body" id="guide-body"></div>
      <div class="comments-section" id="comments">
        <h2 class="comments-title">Comentarios</h2>
        <ul class="comment-list" id="comment-list">
          <li style="color:var(--muted);font-size:.9rem">Cargando&hellip;</li>
        </ul>
        <div id="comment-form-wrap"></div>
      </div>`;

    document.getElementById('guide-body').innerHTML = guide.content || '';

    if (user) {
      document.getElementById('comment-form-wrap').innerHTML = `
        <form class="comment-form" id="comment-form">
          <textarea placeholder="Tu comentario…" required maxlength="1000"></textarea>
          <div><button class="btn btn-sm" type="submit">Comentar</button></div>
        </form>`;
      document.getElementById('comment-form').addEventListener('submit', async e => {
        e.preventDefault();
        const text = e.target.querySelector('textarea').value.trim();
        if (!text) return;
        await fetch('api/comments', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'guide', target_id: Number(id), content: text }),
        });
        e.target.querySelector('textarea').value = '';
        loadComments();
      });
    } else {
      document.getElementById('comment-form-wrap').innerHTML =
        `<p class="comment-login-note"><a href="api/auth/discord">Inicia sesión con Discord</a> para comentar.</p>`;
    }

    loadComments();
  });

  async function loadComments() {
    try {
      const comments = await fetch(`api/comments?type=guide&id=${id}`).then(r => r.json());
      const list = document.getElementById('comment-list');
      if (!comments?.length) {
        list.innerHTML = '<li style="color:var(--muted);font-size:.9rem">Sin comentarios todavía. ¡Sé el primero!</li>';
        return;
      }
      list.innerHTML = comments.map(c => `
        <li class="comment">
          <div class="comment-avatar ${c.gender === 'female' ? 'avatar-f' : 'avatar-m'}">
            ${c.avatar ? `<img src="${escH(c.avatar)}" alt="${escH(c.username)}">` : ''}
          </div>
          <div class="comment-body">
            <div class="comment-header">
              <span class="comment-author">${escH(c.username)}</span>
              <span class="comment-date">${fmtDate(c.created_at)}</span>
            </div>
            <p class="comment-text">${escH(c.content)}</p>
          </div>
        </li>`).join('');
    } catch {}
  }
  </script>
</body>
</html>
